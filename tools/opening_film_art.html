<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local State Windows — Opening Story Film</title>
<style>
:root {
  --live: #22303c;
  --ghost: #b9c2c8;
  --band: rgba(31,138,132,0.13);
  --band-edge: #1f8a84;
  --axis: #9aa5ae;
  --ink: #22303c;
  --muted: #6b7781;
  --offset: #6b4a8c;
  --count: #22303c;
}

body {
  margin: 0;
  background: #fbf7f1;
  font-family: Arial, Helvetica, sans-serif;
}

svg {
  display: block;
  font-family: Arial, Helvetica, sans-serif;
}

/* Shared animation contract: 20s linear 0s infinite */
.scene1-vis,
.scene1-text-vis,
.bench-vis,
.bench-text-vis,
.counter-label-vis,
.offset-ui-vis,
.scene5-vis,
.scene5-text-vis,
.watermark-vis,
.bar-reveal,
.rbc-drift-1,
.rbc-drift-2,
.rbc-drift-3,
.gluc-ambient-1,
.gluc-ambient-2,
.gluc-ambient-3,
.gluc-arrive-1,
.gluc-arrive-2,
.gluc-arrive-3,
.gluc-arrive-4,
.gluc-arrive-5,
.cell-pulse-a,
.cell-pulse-b,
.tip-pulse-ring,
.tip-pulse-glow,
.readout-1,
.readout-2,
.readout-3,
.readout-4,
.readout-5,
.rdot-1,
.rdot-2,
.rdot-3,
.rdot-4,
.rdot-5,
.pip-1,
.pip-2,
.pip-3,
.pip-4,
.tag-recorded,
.tag-const12,
.tag-most,
.tag-fewest,
.cap-1,
.cap-2,
.cap-3a,
.cap-3b,
.cap-4,
.cap-5,
.prog-1,
.prog-2,
.prog-3,
.prog-4,
.prog-5 {
  animation-duration: 20s;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  animation-delay: 0s;
}

.cell-pulse-a,
.cell-pulse-b,
.tip-pulse-ring,
.tip-pulse-glow {
  transform-box: fill-box;
  transform-origin: center;
}

/* =========================================================
   SCENE VISIBILITY (20s = 100%, 1s = 5%)
   ========================================================= */

/* Scene 1 artwork: 0.0-4.4s (dissolve out 4.0-4.6s = 20%-23%; dissolve in 19.6-20.0s = 98%-100%) */
.scene1-vis { animation-name: kf-scene1-vis; }
@keyframes kf-scene1-vis {
  0%     { opacity: 1; }
  20.0%  { opacity: 1; }
  20.75% { opacity: 0.82; }
  21.5%  { opacity: 0.5; }
  22.25% { opacity: 0.18; }
  23.0%  { opacity: 0; }
  98.0%  { opacity: 0; }
  98.5%  { opacity: 0.2; }
  99.0%  { opacity: 0.5; }
  99.5%  { opacity: 0.82; }
  100%   { opacity: 1; }
}

/* Scene 1 text: fades out cleanly by 4.35s (21.75%) before Scene 2 / Data Layer text at 4.4s (22%) */
.scene1-text-vis { animation-name: kf-scene1-text-vis; }
@keyframes kf-scene1-text-vis {
  0%     { opacity: 1; }
  20.0%  { opacity: 1; }
  20.9%  { opacity: 0.5; }
  21.75% { opacity: 0; }
  98.25% { opacity: 0; }
  99.1%  { opacity: 0.5; }
  100%   { opacity: 1; }
}

/* Scenes 2-4 bench backdrops & plate body: 4.4-16.3s (dissolve in 4.1-4.5s, out 16.2-16.6s) */
.bench-vis { animation-name: kf-bench-vis; }
@keyframes kf-bench-vis {
  0%     { opacity: 0; }
  20.5%  { opacity: 0; }
  21.25% { opacity: 0.25; }
  22.0%  { opacity: 0.75; }
  22.5%  { opacity: 1; }
  81.0%  { opacity: 1; }
  81.75% { opacity: 0.7; }
  82.5%  { opacity: 0.25; }
  83.0%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* Scenes 2-4 bench headings & plate labels: strictly within 4.4-16.3s (22.0%-81.5%) */
.bench-text-vis { animation-name: kf-bench-text-vis; }
@keyframes kf-bench-text-vis {
  0%     { opacity: 0; }
  21.8%  { opacity: 0; }
  22.3%  { opacity: 0.5; }
  22.8%  { opacity: 1; }
  80.7%  { opacity: 1; }
  81.2%  { opacity: 0.5; }
  81.7%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* "of 96 in the band": visible 6.5-16.3s (32.5%-81.5%) */
.counter-label-vis { animation-name: kf-counter-label-vis; }
@keyframes kf-counter-label-vis {
  0%     { opacity: 0; }
  31.8%  { opacity: 0; }
  32.4%  { opacity: 0.5; }
  33.0%  { opacity: 1; }
  80.7%  { opacity: 1; }
  81.2%  { opacity: 0.5; }
  81.7%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* Offset strip heading + budget label + hollow pips: 8.6-16.3s (43.0%-81.5%) */
.offset-ui-vis { animation-name: kf-offset-ui-vis; }
@keyframes kf-offset-ui-vis {
  0%     { opacity: 0; }
  42.3%  { opacity: 0; }
  42.9%  { opacity: 0.5; }
  43.5%  { opacity: 1; }
  80.7%  { opacity: 1; }
  81.2%  { opacity: 0.5; }
  81.7%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* Scene 5 card: dissolve in 16.3-16.7s (81.5%-83.5%), dissolve to Scene 1 19.6-20.0s (98.0%-100%) */
.scene5-vis { animation-name: kf-scene5-vis; }
@keyframes kf-scene5-vis {
  0%     { opacity: 0; }
  81.5%  { opacity: 0; }
  82.5%  { opacity: 0.5; }
  83.5%  { opacity: 1; }
  98.0%  { opacity: 1; }
  99.0%  { opacity: 0.45; }
  100%   { opacity: 0; }
}

/* Scene 5 text: active 16.4-19.65s (82.0%-98.25%) so zero overlap with bench or scene 1 text */
.scene5-text-vis { animation-name: kf-scene5-text-vis; }
@keyframes kf-scene5-text-vis {
  0%     { opacity: 0; }
  81.8%  { opacity: 0; }
  82.6%  { opacity: 0.5; }
  83.4%  { opacity: 1; }
  97.4%  { opacity: 1; }
  97.85% { opacity: 0.5; }
  98.2%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* Faint watermark echo of skin cross-section in Scene 5 (max opacity 0.08 <= 0.12) */
.watermark-vis { animation-name: kf-watermark-vis; }
@keyframes kf-watermark-vis {
  0%     { opacity: 0; }
  81.5%  { opacity: 0; }
  83.5%  { opacity: 0.08; }
  98.0%  { opacity: 0.08; }
  100%   { opacity: 0; }
}

/* Scene 5 scale bar left-to-right reveal (63 to 92 = 241.7px) */
.bar-reveal { animation-name: kf-bar-reveal; }
@keyframes kf-bar-reveal {
  0%     { stroke-dashoffset: 242; }
  82.5%  { stroke-dashoffset: 242; }
  84.0%  { stroke-dashoffset: 180; }
  85.5%  { stroke-dashoffset: 85; }
  87.0%  { stroke-dashoffset: 0; }
  100%   { stroke-dashoffset: 0; }
}

/* =========================================================
   SCENE 1 HISTOLOGY MOTION (Cells, RBCs, Glucose, Sensor Tip)
   ========================================================= */

.cell-pulse-a { animation-name: kf-cell-pulse-a; }
@keyframes kf-cell-pulse-a {
  0%    { transform: scale(1); }
  12%   { transform: scale(1.035); }
  25%   { transform: scale(1); }
  50%   { transform: scale(1.03); }
  75%   { transform: scale(0.985); }
  100%  { transform: scale(1); }
}

.cell-pulse-b { animation-name: kf-cell-pulse-b; }
@keyframes kf-cell-pulse-b {
  0%    { transform: scale(1); }
  10%   { transform: scale(0.975); }
  22%   { transform: scale(1.04); }
  45%   { transform: scale(1); }
  70%   { transform: scale(1.03); }
  100%  { transform: scale(1); }
}

/* Red blood cells drifting along the capillary (looping cleanly at 0% and 100%) */
.rbc-drift-1 { animation-name: kf-rbc-drift-1; }
@keyframes kf-rbc-drift-1 {
  0%    { transform: translate(0px, 0px); }
  11%   { transform: translate(58px, -3px); }
  23%   { transform: translate(118px, 1px); }
  50%   { transform: translate(60px, 2px); }
  97%   { transform: translate(-8px, 0px); }
  100%  { transform: translate(0px, 0px); }
}

.rbc-drift-2 { animation-name: kf-rbc-drift-2; }
@keyframes kf-rbc-drift-2 {
  0%    { transform: translate(0px, 0px); }
  11%   { transform: translate(46px, 2px); }
  23%   { transform: translate(96px, -2px); }
  50%   { transform: translate(48px, -1px); }
  97%   { transform: translate(-6px, 0px); }
  100%  { transform: translate(0px, 0px); }
}

.rbc-drift-3 { animation-name: kf-rbc-drift-3; }
@keyframes kf-rbc-drift-3 {
  0%    { transform: translate(0px, 0px); }
  11%   { transform: translate(66px, -2px); }
  23%   { transform: translate(134px, -4px); }
  50%   { transform: translate(64px, 1px); }
  97%   { transform: translate(-10px, 0px); }
  100%  { transform: translate(0px, 0px); }
}

/* Ambient interstitial glucose drift */
.gluc-ambient-1 { animation-name: kf-gluc-ambient-1; }
@keyframes kf-gluc-ambient-1 {
  0%    { transform: translate(0px, 0px); }
  6%    { transform: translate(10px, -14px); }
  12%   { transform: translate(22px, -26px); }
  18%   { transform: translate(30px, -38px); }
  24%   { transform: translate(36px, -46px); }
  97%   { transform: translate(-4px, 4px); }
  100%  { transform: translate(0px, 0px); }
}

.gluc-ambient-2 { animation-name: kf-gluc-ambient-2; }
@keyframes kf-gluc-ambient-2 {
  0%    { transform: translate(0px, 0px); }
  8%    { transform: translate(-12px, -16px); }
  16%   { transform: translate(-20px, -32px); }
  24%   { transform: translate(-28px, -44px); }
  97%   { transform: translate(3px, 4px); }
  100%  { transform: translate(0px, 0px); }
}

.gluc-ambient-3 { animation-name: kf-gluc-ambient-3; }
@keyframes kf-gluc-ambient-3 {
  0%    { transform: translate(0px, 0px); }
  10%   { transform: translate(14px, -10px); }
  20%   { transform: translate(6px, -24px); }
  24%   { transform: translate(2px, -30px); }
  97%   { transform: translate(-2px, 3px); }
  100%  { transform: translate(0px, 0px); }
}

/* 5 Glucose rings leaving the capillary (y=462) and reaching filament tip (450, 342)
   Arrivals at: #1=0.3s(1.5%), #2=1.1s(5.5%), #3=1.9s(9.5%), #4=2.7s(13.5%), #5=3.5s(17.5%) */
.gluc-arrive-1 { animation-name: kf-gluc-arrive-1; }
@keyframes kf-gluc-arrive-1 {
  0%    { transform: translate(-18px, 38px); opacity: 0.95; }
  0.8%  { transform: translate(-8px, 16px); opacity: 1; }
  1.5%  { transform: translate(0px, 0px); opacity: 1; }
  2.2%  { transform: translate(2px, -4px); opacity: 0; }
  98.0% { transform: translate(-36px, 82px); opacity: 0; }
  99.0% { transform: translate(-28px, 60px); opacity: 0.7; }
  100%  { transform: translate(-18px, 38px); opacity: 0.95; }
}

.gluc-arrive-2 { animation-name: kf-gluc-arrive-2; }
@keyframes kf-gluc-arrive-2 {
  0%    { transform: translate(-64px, 118px); opacity: 0.75; }
  2.0%  { transform: translate(-44px, 84px); opacity: 0.95; }
  3.8%  { transform: translate(-20px, 38px); opacity: 1; }
  5.5%  { transform: translate(0px, 0px); opacity: 1; }
  6.2%  { transform: translate(2px, -4px); opacity: 0; }
  98.5% { transform: translate(-64px, 118px); opacity: 0; }
  100%  { transform: translate(-64px, 118px); opacity: 0.75; }
}

.gluc-arrive-3 { animation-name: kf-gluc-arrive-3; }
@keyframes kf-gluc-arrive-3 {
  0%    { transform: translate(58px, 122px); opacity: 0.4; }
  3.5%  { transform: translate(50px, 104px); opacity: 0.85; }
  6.5%  { transform: translate(26px, 54px); opacity: 1; }
  8.2%  { transform: translate(10px, 20px); opacity: 1; }
  9.5%  { transform: translate(0px, 0px); opacity: 1; }
  10.2% { transform: translate(-2px, -4px); opacity: 0; }
  99.0% { transform: translate(58px, 122px); opacity: 0; }
  100%  { transform: translate(58px, 122px); opacity: 0.4; }
}

.gluc-arrive-4 { animation-name: kf-gluc-arrive-4; }
@keyframes kf-gluc-arrive-4 {
  0%    { transform: translate(-18px, 126px); opacity: 0.2; }
  7.0%  { transform: translate(-18px, 120px); opacity: 0.75; }
  10.0% { transform: translate(-12px, 72px); opacity: 0.95; }
  12.0% { transform: translate(-5px, 28px); opacity: 1; }
  13.5% { transform: translate(0px, 0px); opacity: 1; }
  14.2% { transform: translate(0px, -4px); opacity: 0; }
  99.0% { transform: translate(-18px, 126px); opacity: 0; }
  100%  { transform: translate(-18px, 126px); opacity: 0.2; }
}

.gluc-arrive-5 { animation-name: kf-gluc-arrive-5; }
@keyframes kf-gluc-arrive-5 {
  0%    { transform: translate(82px, 124px); opacity: 0.15; }
  11.0% { transform: translate(74px, 114px); opacity: 0.75; }
  14.0% { transform: translate(42px, 68px); opacity: 0.95; }
  16.0% { transform: translate(16px, 26px); opacity: 1; }
  17.5% { transform: translate(0px, 0px); opacity: 1; }
  18.2% { transform: translate(-2px, -4px); opacity: 0; }
  99.0% { transform: translate(82px, 124px); opacity: 0; }
  100%  { transform: translate(82px, 124px); opacity: 0.15; }
}

/* Teal pulse at filament tip on each arrival: 1.5%(0.3s), 5.5%(1.1s), 9.5%(1.9s), 13.5%(2.7s), 17.5%(3.5s) */
.tip-pulse-ring { animation-name: kf-tip-pulse-ring; }
@keyframes kf-tip-pulse-ring {
  0%    { transform: scale(0.5); opacity: 0; }
  1.3%  { transform: scale(0.5); opacity: 0; }
  1.6%  { transform: scale(0.85); opacity: 0.9; }
  2.4%  { transform: scale(1.45); opacity: 0.4; }
  3.2%  { transform: scale(1.9); opacity: 0; }

  5.3%  { transform: scale(0.5); opacity: 0; }
  5.6%  { transform: scale(0.85); opacity: 0.9; }
  6.4%  { transform: scale(1.45); opacity: 0.4; }
  7.2%  { transform: scale(1.9); opacity: 0; }

  9.3%  { transform: scale(0.5); opacity: 0; }
  9.6%  { transform: scale(0.85); opacity: 0.9; }
  10.4% { transform: scale(1.45); opacity: 0.4; }
  11.2% { transform: scale(1.9); opacity: 0; }

  13.3% { transform: scale(0.5); opacity: 0; }
  13.6% { transform: scale(0.85); opacity: 0.9; }
  14.4% { transform: scale(1.45); opacity: 0.4; }
  15.2% { transform: scale(1.9); opacity: 0; }

  17.3% { transform: scale(0.5); opacity: 0; }
  17.6% { transform: scale(0.85); opacity: 0.9; }
  18.4% { transform: scale(1.45); opacity: 0.4; }
  19.2% { transform: scale(1.9); opacity: 0; }
  100%  { transform: scale(0.5); opacity: 0; }
}

.tip-pulse-glow { animation-name: kf-tip-pulse-glow; }
@keyframes kf-tip-pulse-glow {
  0%    { opacity: 0.15; transform: scale(0.9); }
  1.4%  { opacity: 0.15; transform: scale(0.9); }
  1.7%  { opacity: 0.85; transform: scale(1.25); }
  2.8%  { opacity: 0.15; transform: scale(0.9); }

  5.4%  { opacity: 0.15; transform: scale(0.9); }
  5.7%  { opacity: 0.85; transform: scale(1.25); }
  6.8%  { opacity: 0.15; transform: scale(0.9); }

  9.4%  { opacity: 0.15; transform: scale(0.9); }
  9.7%  { opacity: 0.85; transform: scale(1.25); }
  10.8% { opacity: 0.15; transform: scale(0.9); }

  13.4% { opacity: 0.15; transform: scale(0.9); }
  13.7% { opacity: 0.85; transform: scale(1.25); }
  14.8% { opacity: 0.15; transform: scale(0.9); }

  17.4% { opacity: 0.15; transform: scale(0.9); }
  17.7% { opacity: 0.85; transform: scale(1.25); }
  18.8% { opacity: 0.15; transform: scale(0.9); }
  100%  { opacity: 0.15; transform: scale(0.9); }
}

/* =========================================================
   SCENE 1 READ-OUT NUMBERS ("61", "59", "58", "59", "63")
   Cross-faded at ~0.8s intervals with non-overlapping touch-at-zero transitions
   ========================================================= */

/* Reading 1: "61" (0.0-0.85s = 0%-4.25%) */
.readout-1 { animation-name: kf-readout-1; }
@keyframes kf-readout-1 {
  0% { opacity: 1; }
  4.24% { opacity: 1; }
  4.25% { opacity: 0; }
  98.5% { opacity: 0; }
  99.25% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* Reading 2: "59" (0.85-1.65s = 4.25%-8.25%) */
.readout-2 { animation-name: kf-readout-2; }
@keyframes kf-readout-2 {
  0% { opacity: 0; }
  4.24% { opacity: 0; }
  4.25% { opacity: 1; }
  8.24% { opacity: 1; }
  8.25% { opacity: 0; }
  100% { opacity: 0; }
}

/* Reading 3: "58" (1.65-2.45s = 8.25%-12.25%) */
.readout-3 { animation-name: kf-readout-3; }
@keyframes kf-readout-3 {
  0% { opacity: 0; }
  8.24% { opacity: 0; }
  8.25% { opacity: 1; }
  12.24% { opacity: 1; }
  12.25% { opacity: 0; }
  100% { opacity: 0; }
}

/* Reading 4: "59" (2.45-3.25s = 12.25%-16.25%) */
.readout-4 { animation-name: kf-readout-4; }
@keyframes kf-readout-4 {
  0% { opacity: 0; }
  12.24% { opacity: 0; }
  12.25% { opacity: 1; }
  16.24% { opacity: 1; }
  16.25% { opacity: 0; }
  100% { opacity: 0; }
}

/* Reading 5: "63" (3.25-4.35s = 16.25%-21.75%) */
.readout-5 { animation-name: kf-readout-5; }
@keyframes kf-readout-5 {
  0% { opacity: 0; }
  16.24% { opacity: 0; }
  16.25% { opacity: 1; }
  20.5% { opacity: 1; }
  21.1% { opacity: 0.5; }
  21.75% { opacity: 0; }
  100% { opacity: 0; }
}

/* Five dots under the readout number filling one per reading */
.rdot-1 { animation-name: kf-rdot-1; }
@keyframes kf-rdot-1 {
  0%    { opacity: 1; }
  22.0% { opacity: 1; }
  23.0% { opacity: 0; }
  98.5% { opacity: 0; }
  100%  { opacity: 1; }
}

.rdot-2 { animation-name: kf-rdot-2; }
@keyframes kf-rdot-2 {
  0%    { opacity: 0; }
  4.25% { opacity: 0; }
  4.75% { opacity: 1; }
  22.0% { opacity: 1; }
  23.0% { opacity: 0; }
  100%  { opacity: 0; }
}

.rdot-3 { animation-name: kf-rdot-3; }
@keyframes kf-rdot-3 {
  0%    { opacity: 0; }
  8.25% { opacity: 0; }
  8.75% { opacity: 1; }
  22.0% { opacity: 1; }
  23.0% { opacity: 0; }
  100%  { opacity: 0; }
}

.rdot-4 { animation-name: kf-rdot-4; }
@keyframes kf-rdot-4 {
  0%     { opacity: 0; }
  12.25% { opacity: 0; }
  12.75% { opacity: 1; }
  22.0%  { opacity: 1; }
  23.0%  { opacity: 0; }
  100%   { opacity: 0; }
}

.rdot-5 { animation-name: kf-rdot-5; }
@keyframes kf-rdot-5 {
  0%     { opacity: 0; }
  16.25% { opacity: 0; }
  16.75% { opacity: 1; }
  22.0%  { opacity: 1; }
  23.0%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* =========================================================
   SCENE 3 BUDGET PIPS
   Fill solid violet at 11.0s (55%), 11.2s (56%), 11.4s (57%), 11.6s (58%);
   Empty one by one between 13.2s (66%) and 13.6s (68%).
   ========================================================= */

.pip-1 { animation-name: kf-pip-1; }
@keyframes kf-pip-1 {
  0%     { opacity: 0; }
  54.6%  { opacity: 0; }
  55.0%  { opacity: 1; }
  67.5%  { opacity: 1; }
  68.0%  { opacity: 0; }
  100%   { opacity: 0; }
}

.pip-2 { animation-name: kf-pip-2; }
@keyframes kf-pip-2 {
  0%     { opacity: 0; }
  55.6%  { opacity: 0; }
  56.0%  { opacity: 1; }
  67.0%  { opacity: 1; }
  67.5%  { opacity: 0; }
  100%   { opacity: 0; }
}

.pip-3 { animation-name: kf-pip-3; }
@keyframes kf-pip-3 {
  0%     { opacity: 0; }
  56.6%  { opacity: 0; }
  57.0%  { opacity: 1; }
  66.5%  { opacity: 1; }
  67.0%  { opacity: 0; }
  100%   { opacity: 0; }
}

.pip-4 { animation-name: kf-pip-4; }
@keyframes kf-pip-4 {
  0%     { opacity: 0; }
  57.6%  { opacity: 0; }
  58.0%  { opacity: 1; }
  66.0%  { opacity: 1; }
  66.5%  { opacity: 0; }
  100%   { opacity: 0; }
}

/* =========================================================
   STATE TAGS UNDER PLATE (x=1228, y=520)
